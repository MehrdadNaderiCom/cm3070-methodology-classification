# Source metadata to field label.
#
# Written after the corpus was collected, against the categories that actually
# appear in it, rather than guessed in advance. Anything absent from both tables
# yields a blank field label. A blank is honest; an invented label is not.

version: 1

# arXiv primary category area, as recorded in the frozen 50 paper sample.
arxiv:
  Machine Learning: Artificial Intelligence and Machine Learning
  AI: Artificial Intelligence and Machine Learning
  NLP: Artificial Intelligence and Machine Learning
  Computer Vision: Artificial Intelligence and Machine Learning
  Robotics: Artificial Intelligence and Machine Learning
  Software Engineering: Software Engineering
  HCI: Human Computer Interaction
  Databases: Data Management and Analytics
  Information Retrieval: Data Management and Analytics
  Distributed Computing: Networks and Distributed Systems
  Information Theory: Theory and Algorithms
  Architecture: Networks and Distributed Systems

# Robotics is placed under Artificial Intelligence and Machine Learning because
# the robotics papers in this corpus are learning based rather than mechanical.
# Architecture is placed under Networks and Distributed Systems as the closest
# systems category available. Both are judgement calls affecting five papers in
# total and are recorded here so they can be checked.

