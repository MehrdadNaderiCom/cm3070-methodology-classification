# Deliberately left unmapped, because no defensible computing field fits and a
# guess would put noise into the ground truth:
#   Computer Science Applications   too broad to distinguish a field
#   General Health Professions      outside computing
#   Health, Toxicology and Mutagenesis  outside computing
#   Food Science                    outside computing
